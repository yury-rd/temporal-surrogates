name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducibility dependencies
        run: python -m pip install -r requirements-repro.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Read saved aggregates
        run: python run.py --mode summary --output results/summary.json
      - name: Run the synthetic example
        run: python run.py --output results/demo.json
